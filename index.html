<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A keyboard-first local workspace for your GitHub reviews." />
    <meta name="color-scheme" content="light dark" />
    <title>Review Desk</title>
    <script>
      try {
        var theme = localStorage.getItem('review-desk-theme') || 'system';
        var density = localStorage.getItem('review-desk-density') || 'comfortable';
        var dark =
          theme === 'dark' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);

        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.density = density;
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
