<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fb" />
    <meta name="description" content="A local workspace for your GitHub reviews and follow-ups." />
    <title>Review Desk · Your review workspace</title>
    <script>
      const saved = localStorage.getItem('review-desk-theme') || 'system';
      document.documentElement.dataset.theme =
        saved === 'system'
          ? matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
          : saved;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
