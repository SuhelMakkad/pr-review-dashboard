name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes the running checks moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, types, unit tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs the token; the pull request's own code runs below.
          persist-credentials: false
          # A pull request's merge commit and its first parent, the branch it merges into, whose
          # prompt pins the check below compares with.
          fetch-depth: 2

      # Actions are pinned to reviewed commits. The pnpm version comes from `packageManager` in
      # package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm db:check

      # A prompt's pinned digest may change only with its version, against the branch it merges into.
      - if: github.event_name == 'pull_request'
        run: pnpm prompt:pins HEAD^1

  e2e:
    name: End-to-end (Linux, without screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs the token; the pull request's own code runs below.
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The tests run headless: the shell alone, with the system libraries it needs.
      - run: pnpm exec playwright install --with-deps --only-shell chromium

      # The visual baselines are macOS renderings: here every other check runs, screenshots aside.
      - run: pnpm exec playwright test --ignore-snapshots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  screenshots:
    name: End-to-end with screenshots (macOS)
    # The image the baselines last matched: a newer one can render fonts differently.
    runs-on: macos-26
    timeout-minutes: 40
    # Baselines are recorded on a developer's Mac; a hosted runner's fonts can render a little
    # differently, so a difference is reported here without failing the change.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs the token; the pull request's own code runs below.
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm exec playwright install --only-shell chromium

      - run: pnpm exec playwright test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: screenshot-results
          path: test-results/
          retention-days: 7
